        <style>

            body {
                font-family: "Inter", sans-serif;
                background-color: #f4f4f9;
                background-image: url("https://static.wixstatic.com/media/78f398_a234c126e61e4567a135a8e5ed33ef1a~mv2.jpg");
                background-size: cover;
                // object-fit: fill;
                background-repeat: no-repeat;
                display: flex;
                justify-content: center;
                padding: 40px 20px;
            }
            .container {
                width: 100%;
                max-width: 600px;
                background: white;
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
                padding: 30px;
            }
            h1 {
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: -1px;
                margin-bottom: 30px;
                text-align: center;
            }
            .row {
                display: flex;
                justify-content: space-between;
                padding: 15px 10px;
                border-bottom: 1px solid #eee;
                font-size: 1.1rem;
            }
            .row:last-child {
                border-bottom: none;
            }
            .rank {
                font-weight: 700;
                color: #666;
                width: 70px;
            }
            .name {
                flex-grow: 1;
                font-weight: 700;
            }
            .score {
                font-weight: 900;
                color: #2d3436;
            }

            // style for carousel banner

            .vendor-slider {
                position: relative;
                z-index: 0;

                /* Existing styles */
                overflow: hidden;
                background: white;
                width: 100%;
            }

            .vendor-slider {
                overflow: hidden; /* Hides the logos outside the container */
                background: white;
                padding: 40px 0;
                width: 100%;
            }

            .vendor-track {
                display: flex;
                width: calc(
                    250px * 6
                ); /* (Slide Width * Number of Total Slides) */
                animation: scroll 40s linear infinite;
                will-change: transform;
            }

            .slide {
                width: 250px; /* Consistent width for each vendor */
                display: flex;
                flex-shrink: 0;
                align-items: center;
                justify-content: center;
                // padding: 0px 5px;
                margin: 10px 15px;
            }

            .slide img {
                max-width: 100%;
                height: 100%;
                object-fit: contain;
                // filter: grayscale(
                //     100%
                // ); /* Optional: matches the "professional" look */
                // transition: 0.3s;
            }

            .slide img:hover {
                filter: grayscale(0%); /* Color on hover */
            }

            /* The Magic: Moves the track by half its total width */
            @keyframes scroll {
                0% {
                    // transform: translateX(-5%);
                    transform: translateX(0%);
                }
                100% {
                    //transform: translateX(calc(-250px * 3));
                    // transform: translateX(-505);
                    transform: translateX(-616%);
                } /* Negative (Slide Width * Original Number of Slides) */
            }
        </style>

            <h1>Top Performers</h1>
            <div id="board">Loading rankings...</div>
        </div>

        <script>
            // Automatically load data on page load
            window.onload = function () {
                google.script.run
                    .withSuccessHandler(drawTable)
                    .getLeaderboardData();
                // checks score every minute
                setInterval(function () {
                    google.script.run
                        .withSuccessHandler(drawTable)
                        .getLeaderboardData();
                }, 60000);
                // google.script.run.withFailureHandler().onFailure();
            };

            function drawTable(data) {
                if (!data || data.length === 0) {
                    document.getElementById("board").innerHTML =
                        "No data found.";
                    return;
                }

                let html = `
                <div class="row">
                <span class="rank">Rank</span>
                <span class="name">Names</span>
                <span class="score">Score</span>
                </div>`;

                data.forEach((row, index) => {
                    html += `
                <div class="row">
                <span class="rank">#${row[0]}</span>
                <span class="name">${row[1]}</span>
                <span class="score">${row[2]}</span>
                </div>`;
                });
                document.getElementById("board").innerHTML = html;

                // color 1st, second, and withFailureHandler
                top_three = document.getElementsByClassName("row");
                top_three[1].style.background = "#FFD700";
                top_three[2].style.background = "#FF1493";
                top_three[3].style.background = "#0077BE";
            }
        </script>
