name: Deploy

# Deploys each environment's Apps Script projects AND its Netlify scoring
# app. Staging deploys automatically on every push to main that touches
# either. Production runs after staging and waits for manual approval
# (required reviewers on the "production" environment).
# See docs/deployment.md for the one-time setup.
on:
  push:
    branches: [main]
    paths:
      - "apps_script/**"
      - "app_files_for_netlify/app/**"
      - "app_files_for_netlify/netlify.toml"
      - "scripts/**"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is per job (per environment), not per workflow: a production
# deploy waiting for approval must not block later staging deploys. Within
# one environment a running deploy is never interrupted; a newer queued
# deploy replaces an older queued one, so the latest main wins.

jobs:
  checks:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  staging:
    name: Deploy to staging
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://lknitpdiscgolfstaging.netlify.app
    concurrency:
      group: deploy-apps-script-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - id: creds
        name: Check deploy credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          for s in CLASPRC_JSON NETLIFY_AUTH_TOKEN; do
            if [ -z "${!s}" ]; then
              echo "::warning::$s secret not set for 'staging'; that part of the deploy is skipped (see docs/deployment.md)"
              echo "$s=false" >> "$GITHUB_OUTPUT"
            else
              echo "$s=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.creds.outputs.CLASPRC_JSON == 'true'
        name: Install clasp and write credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@3.4.1
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
      - if: steps.creds.outputs.CLASPRC_JSON == 'true'
        name: Deploy Apps Script
        run: node scripts/deploy-apps-script.js staging
      - if: steps.creds.outputs.NETLIFY_AUTH_TOKEN == 'true'
        name: Deploy Netlify app
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli@26.0.2
          node scripts/deploy-netlify.js staging

  production:
    name: Deploy to production
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lknitpdiscgolf.netlify.app
    concurrency:
      group: deploy-apps-script-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - id: creds
        name: Check deploy credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          for s in CLASPRC_JSON NETLIFY_AUTH_TOKEN; do
            if [ -z "${!s}" ]; then
              echo "::warning::$s secret not set for 'production'; that part of the deploy is skipped (see docs/deployment.md)"
              echo "$s=false" >> "$GITHUB_OUTPUT"
            else
              echo "$s=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.creds.outputs.CLASPRC_JSON == 'true'
        name: Install clasp and write credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@3.4.1
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
      - if: steps.creds.outputs.CLASPRC_JSON == 'true'
        name: Deploy Apps Script
        run: node scripts/deploy-apps-script.js production
      - if: steps.creds.outputs.NETLIFY_AUTH_TOKEN == 'true'
        name: Deploy Netlify app
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli@26.0.2
          node scripts/deploy-netlify.js production
