name: Deploy Apps Script

# Staging deploys automatically on every push to main that touches the
# Apps Script code. Production runs after staging and waits for manual
# approval (configure required reviewers on the "production" environment).
# See docs/deployment.md for the one-time setup.
on:
  push:
    branches: [main]
    paths:
      - "apps_script/**"
      - "scripts/deploy-apps-script.js"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is per job (per environment), not per workflow: a production
# deploy waiting for approval must not block later staging deploys. Within
# one environment a running deploy is never interrupted; a newer queued
# deploy replaces an older queued one, so the latest main wins.

jobs:
  checks:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  staging:
    name: Deploy to staging
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-apps-script-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: creds
        name: Check deploy credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::CLASPRC_JSON secret not set for 'staging'; skipping deploy (see docs/deployment.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.creds.outputs.configured == 'true'
        name: Install clasp and write credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@3.4.1
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
      - if: steps.creds.outputs.configured == 'true'
        run: node scripts/deploy-apps-script.js staging

  production:
    name: Deploy to production
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-apps-script-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: creds
        name: Check deploy credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::CLASPRC_JSON secret not set for 'production'; skipping deploy (see docs/deployment.md)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.creds.outputs.configured == 'true'
        name: Install clasp and write credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@3.4.1
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
      - if: steps.creds.outputs.configured == 'true'
        run: node scripts/deploy-apps-script.js production
