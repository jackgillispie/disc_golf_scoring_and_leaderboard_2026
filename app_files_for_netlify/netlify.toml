# netlify.toml

[build]
  # This is where your index.html and script.js are.
  # Netlify will serve these to the user's browser.
  publish = "app"

[functions]
  # This is where your save-score.js is hidden.
  # Netlify will bundle this with Axios and deploy it to a secure server.
  directory = "netlify/functions"

[[redirects]]
  # This is an optional "fail-safe."
  # It ensures that all traffic to /api/ is routed to your functions.
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  # Redirects all traffic to index.html for "Clean URLs"
  # and Single Page Application (SPA) functionality
  from = "/*"
  to = "/index.html"
  status = 200

  # Netlify handles query parameters automatically.
  # This rule preserves them by default (e.g., /?id=123)
  force = false
